name: Build BlemmLauncher

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools and runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller certifi pillow

      - name: Validate Python sources
        shell: pwsh
        run: |
          python -m py_compile run.py
          Get-ChildItem blemmlauncher\*.py | ForEach-Object { python -m py_compile $_.FullName }

      - name: Verify launcher imports
        shell: pwsh
        run: |
          python -c "from blemmlauncher import gui; print('GUI import OK:', gui.__file__)"

      - name: Build Windows EXE
        shell: pwsh
        run: |
          pyinstaller --clean --onefile --noconsole --uac-admin `
            --name BlemmLauncher `
            --paths . `
            --hidden-import blemmlauncher.gui `
            --hidden-import blemmlauncher.core `
            --hidden-import blemmlauncher.instances `
            --hidden-import blemmlauncher.server `
            --collect-submodules blemmlauncher `
            --collect-submodules Dev `
            --collect-data certifi `
            --hidden-import certifi `
            run.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlemmLauncher-Windows
          path: dist/BlemmLauncher.exe
          if-no-files-found: error
          retention-days: 30

      - name: Install Inno Setup
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          BLEMM_VERSION: ${{ github.ref_name }}
        run: |
          $env:BLEMM_VERSION = $env:BLEMM_VERSION.TrimStart("v")
          & "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe" installer.iss

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BlemmLauncher.exe
            Output/BlemmLauncher-*-Setup.exe
          generate_release_notes: true
