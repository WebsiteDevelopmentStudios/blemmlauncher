name: Build BlemmLauncher
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build exe
        shell: pwsh
        run: |
          pyinstaller --onefile --noconsole --name BlemmLauncher `
            --add-data "blemmlauncher/gui.py;blemmlauncher" `
            run.py

      - name: Upload artifact (every push)
        uses: actions/upload-artifact@v4
        with:
          name: BlemmLauncher-dev
          path: dist/BlemmLauncher.exe

      - name: Release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BlemmLauncher.exe
          generate_release_notes: true
